openapi: 3.0.3
info:
  title: Astrological Reading API
  description: Generates personalized astrological and career readings based on zodiac sign, life era, career archetype, and specific dates.
  version: 1.5.0
paths:
  /reading/{sign}/{era}/{career}/{date}:
    get:
      summary: Retrieve a personalized reading
      description: Fetches a daily reading tailored to a user's sign, life era, career archetype, and a specific date.
      operationId: getReading
      parameters:
        - name: sign
          in: path
          required: true
          description: The user's zodiac sign.
          schema:
            type: string
            enum:
              - aries
              - taurus
              - gemini
              - cancer
              - leo
              - virgo
              - libra
              - scorpio
              - sagittarius
              - capricorn
              - aquarius
              - pisces
        - name: era
          in: path
          required: true
          description: The current life era of the user.
          schema:
            type: string
            enum:
              - explorer
              - builder
              - executive
              - sage
        - name: career
          in: path
          required: true
          description: The user's career archetype.
          schema:
            type: string
            enum:
              - professional
              - leader
              - independent
              - public
        - name: date
          in: path
          required: true
          description: The target date for the reading in YYYYMMDD format.
          schema:
            type: string
            pattern: '^\d{8}$'
            example: "19921231"
      responses:
        '200':
          description: Successful reading response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingResponse'
        '400':
          description: Invalid parameters provided
        '404':
          description: Reading not found

  /reading/general/{date}:
    get:
      summary: Retrieve general readings for all signs
      description: Fetches daily general astrological readings for all 12 zodiac signs on a specific date.
      operationId: getGeneralReadings
      parameters:
        - name: date
          in: path
          required: true
          description: The target date for the readings in YYYYMMDD format.
          schema:
            type: string
            pattern: '^\d{8}$'
            example: "19921231"
      responses:
        '200':
          description: Successful general readings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralReadingResponse'
        '400':
          description: Invalid date parameter provided
        '404':
          description: Readings not found

components:
  schemas:
    RoutineItem:
      type: object
      required:
        - from
        - to
        - title
        - description
      properties:
        from:
          type: integer
          description: Unix timestamp for the start of the routine block.
          example: 1787719200
        to:
          type: integer
          description: Unix timestamp for the end of the routine block.
          example: 1787726400
        title:
          type: string
          example: "Morning Awakening & Grounding"
        description:
          type: string
          example: "Avoid opening your smartphone immediately upon waking up..."

    SynastryItem:
      type: object
      required:
        - sign
        - reading
        - routine
      properties:
        sign:
          type: string
          description: The zodiac sign of the partner.
          enum:
            - aries
            - taurus
            - gemini
            - cancer
            - leo
            - virgo
            - libra
            - scorpio
            - sagittarius
            - capricorn
            - aquarius
            - pisces
          example: "aries"
        reading:
          type: string
          description: Comprehensive relationship advice for this sign pairing.
          example: "Your Aries partner might feel sidelined by your sudden career pivot. Channel their competitive energy by asking for their advice on your next bold move."
        routine:
          type: array
          description: Recommended joint schedule or couple's routine optimized for this astrological pairing.
          items:
            $ref: '#/components/schemas/RoutineItem'

    ReadingsObject:
      type: object
      description: Categorized astrological readings for a specific sign.
      required:
        - sign
        - general
        - career
        - economy
      properties:
        sign:
          type: string
          description: The zodiac sign this reading applies to.
          enum:
            - aries
            - taurus
            - gemini
            - cancer
            - leo
            - virgo
            - libra
            - scorpio
            - sagittarius
            - capricorn
            - aquarius
            - pisces
          example: "pisces"
        general:
          type: string
          description: The overarching astrological reading for the day.
          example: "Your ambition is peaking today..."
        career:
          type: string
          description: A targeted reading based on the user's specific era and career archetype.
          example: "As a young executive, you need to assert boundaries today..."
        economy:
          type: string
          description: Financial and material outlook for the day.
          example: "Avoid impulsive spending; a long-term investment opportunity may present itself."

    ReadingResponse:
      type: object
      required:
        - slug
        - lucky_color
        - readings
        - moods
        - routine
        - synastry
      properties:
        slug:
          type: string
          description: Unique identifier string combining path parameters.
          example: "pisces-explorer-professional-19921231"
        lucky_color:
          type: string
          description: The auspicious color for the day.
          example: "Crimson"
        readings:
          $ref: '#/components/schemas/ReadingsObject'
        moods:
          type: object
          description: Numeric scores (1-10) indicating the energy levels for various aspects of the day.
          required:
            - sex
            - hustle
            - vibe
            - success
          properties:
            sex:
              type: integer
              example: 7
            hustle:
              type: integer
              example: 9
            vibe:
              type: integer
              example: 8
            success:
              type: integer
              example: 8
        routine:
          type: array
          description: Chronological daily schedule/routine optimized for the astrological alignment.
          items:
            $ref: '#/components/schemas/RoutineItem'
        synastry:
          type: array
          description: Comprehensive relationship readings and tailored routines. This array explicitly returns all 12 zodiac signs.
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/SynastryItem'

    GeneralReadingResponse:
      type: object
      required:
        - slug
        - readings
      properties:
        slug:
          type: string
          description: Unique identifier string for the general daily readings.
          example: "general-readings-19921231"
        readings:
          type: array
          description: Daily readings mapped across all 12 zodiac signs. This array explicitly returns all 12 zodiac signs.
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/ReadingsObject'